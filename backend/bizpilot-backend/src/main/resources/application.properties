spring.application.name=bizpilot-backend
server.port=${SERVER_PORT:8080}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bizpilot_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
# Small pool: Render free tier memory and Neon connection limits.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.connection-timeout=${DB_CONNECT_TIMEOUT_MS:30000}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
bizpilot.jwt.secret=${JWT_SECRET}
bizpilot.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
logging.level.com.bizpilot=INFO
bizpilot.jwt.expiration-ms=86400000
spring.mail.host=${MAIL_HOST:smtp.zoho.in}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=8000
spring.mail.properties.mail.smtp.writetimeout=8000
bizpilot.mail.from=${MAIL_USERNAME:}
bizpilot.mail.from-name=BizPilot AI
bizpilot.demo-seed.enabled=${BIZPILOT_DEMO_SEED_ENABLED:false}
bizpilot.demo-seed.email=${BIZPILOT_DEMO_SEED_EMAIL:demo@bizpilot.local}
bizpilot.demo-seed.password=${BIZPILOT_DEMO_SEED_PASSWORD:}
