# Render Blueprint for the BizPilot API (Spring Boot, Docker).
# Database: an external PostgreSQL such as Neon — set DB_URL / DB_USERNAME / DB_PASSWORD in the Render dashboard.
services:
  - type: web
    name: bizpilot-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/bizpilot-backend/Dockerfile
    dockerContext: ./backend/bizpilot-backend
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DB_URL
        sync: false # e.g. jdbc:postgresql://<neon-host>/<db>?sslmode=require
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
